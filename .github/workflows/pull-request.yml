name: Pull Request

on:
  pull_request:
    branches: [main]
    # Skip release PRs (CHANGELOG/manifest/releaseconfig bumps) that never change rendered manifests
    paths:
      - "oci/**"
      - "!oci/releaseconfig.json"
      - "!oci/**/*.md"
      - ".github/workflows/pull-request.yml"

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kustomize-diff:
    uses: dis-way/actions/.github/workflows/kustomize-diff.yml@fb99a38f8177b38ff22ed45377418c4c84c7075d # main
    with:
      build-paths: "oci/*,oci/*/apps,oci/*/multitenancy,oci/*/multitenancy-flux-webhook,oci/*/adminservices,oci/*/platform-aks,oci/*/edge"
    permissions:
      contents: read
      pull-requests: write
