name: Envoy Gateway CRDs

# oci/envoy-gateway-crds/base/envoy-gateway-crds.yaml is vendored from the
# envoyproxy/gateway release assets, because the rendered CRDs are published
# nowhere else. Renovate rewrites only the version pin in the update script, so:
#
#   - on a Renovate branch, re-vendor the manifest for the new version and
#     commit it onto the branch (the "refresh" job), and
#   - on any other pull request, verify the committed manifest still matches
#     upstream for the pinned version (the "verify" job). This catches a
#     hand-edit of the generated file, and an upstream release asset changing
#     after the fact - GitHub release assets are mutable, unlike git tags.
#
# The script also verifies every download against the sha256 digest GitHub
# publishes for the asset via api.github.com, and fails closed if that digest
# cannot be read.
#
# The two paths are separate jobs on purpose. Both check out the pull request
# head, so both execute pull-request-controlled content; only the refresh job
# gets a write-capable token, and it is gated on the Renovate bot identity
# rather than on the branch name, which anyone with push access could choose.

on:
  pull_request:
    branches: [main]
    paths:
      - oci/envoy-gateway-crds/**
      - .github/workflows/refresh-envoy-gateway-crds.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: envoy-gateway-crds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify vendored CRDs
    # Every pull request except the Renovate refresh case handled below.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.event.pull_request.user.login == 'renovate[bot]' &&
        github.actor == 'renovate[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Verify the vendored manifest matches upstream
        env:
          # Read-only in this job: `permissions: contents: read` above. Used
          # only to raise the api.github.com rate limit for the digest lookup.
          GH_TOKEN: ${{ github.token }}
        run: ./oci/envoy-gateway-crds/scripts/update-crds.sh --check

      - name: Validate
        run: .github/workflows/scripts/validate-envoy-gateway-crds.sh

  refresh:
    name: Refresh vendored CRDs
    # Gated on the Renovate bot identity, a same-repo head ref, and the branch
    # prefix. Renovate only rewrites the version pin, so the script executed
    # here is the base branch's own copy.
    #
    # github.actor is checked as well as pull_request.user.login: the author
    # stays renovate[bot] after someone pushes to a Renovate branch, so without
    # it a human push would be executed here with a write token. Such a push
    # falls through to the verify job instead, which is what we want - it fails
    # loudly rather than auto-committing on top of hand-pushed content.
    # Neither login can be spoofed: '[' and ']' are not legal in a GitHub
    # username, so that login belongs only to the App's Bot actor (id 29139614).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login == 'renovate[bot]' &&
       github.actor == 'renovate[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the re-vendored manifest onto the Renovate branch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: Re-vendor the manifest for the pinned version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./oci/envoy-gateway-crds/scripts/update-crds.sh

      # A GITHUB_TOKEN commit does not re-trigger pull_request workflows, so the
      # kustomize-diff check will not re-run against the refreshed file.
      # Validate here, before committing, instead.
      - name: Validate
        run: .github/workflows/scripts/validate-envoy-gateway-crds.sh

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: oci/envoy-gateway-crds/base/envoy-gateway-crds.yaml
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Vendored CRDs already match the pinned version, nothing to do."
            exit 0
          fi

          # A manual dispatch runs against whatever branch was selected, which
          # could be the default branch. Refuse: this step commits without
          # review, so it must only ever touch a topic branch.
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::refusing to commit directly to $DEFAULT_BRANCH; run this on a topic branch and open a pull request" >&2
            exit 1
          fi

          # Commit via the Git Data API so GitHub signs the commit. The Contents
          # API is not usable here: its read path caps at 1 MB and this file is
          # 2.4 MB. A push made with GITHUB_TOKEN does not trigger further
          # workflow runs, so this cannot loop.
          #
          # The blob body goes through a file and --input, never through argv:
          # the base64 of this file is ~3.4 MB and Linux caps a single argument
          # at 128 KB (MAX_ARG_STRLEN), so passing it inline fails with
          # "Argument list too long".
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          python3 .github/workflows/scripts/git-blob-body.py "$FILE" > "$BODY"
          BLOB_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input "$BODY" --jq '.sha')
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_TREE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq '.tree.sha')
          TREE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/trees" \
            -f base_tree="$BASE_TREE" \
            -f 'tree[][path]'="$FILE" \
            -f 'tree[][mode]'=100644 \
            -f 'tree[][type]'=blob \
            -f 'tree[][sha]'="$BLOB_SHA" --jq '.sha')
          # Author is set explicitly so it matches gitIgnoredAuthors in
          # renovate.json - otherwise Renovate sees a commit it did not make,
          # treats the branch as user-modified, and stops maintaining the PR.
          COMMIT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            -f message="deps: refresh vendored envoy gateway CRDs" \
            -f tree="$TREE_SHA" \
            -f 'parents[]'="$HEAD_SHA" \
            -f 'author[name]'="github-actions[bot]" \
            -f 'author[email]'="41898282+github-actions[bot]@users.noreply.github.com" \
            -f 'committer[name]'="github-actions[bot]" \
            -f 'committer[email]'="41898282+github-actions[bot]@users.noreply.github.com" \
            --jq '.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
            -X PATCH -f sha="$COMMIT_SHA"
          echo "Committed $COMMIT_SHA to $BRANCH"
