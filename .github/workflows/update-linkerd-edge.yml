name: Update Linkerd Edge Charts

# Renovate cannot see the RECOMMENDED / NOT_RECOMMENDED badge in the Linkerd
# release notes, so it happily proposes edge releases the project has not
# blessed. This workflow reads that badge from the linkerd2 GitHub releases and
# only proposes the newest release marked RECOMMENDED.

on:
  schedule:
    - cron: '37 7 * * 1'  # Mondays at 07:37 UTC (off the hour — GitHub delays runs scheduled on the hour)
  workflow_dispatch:
    inputs:
      min_age_days:
        description: 'Minimum age (days) a release must have before it is proposed'
        required: false
        default: '14'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-linkerd-edge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find latest RECOMMENDED edge release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '14' }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, urllib.request
          from datetime import datetime, timezone

          FILE = 'oci/linkerd/base/helmrelease.yaml'
          BODY_FILE = 'pr-body.md'
          MIN_AGE_DAYS = int(os.environ.get('MIN_AGE_DAYS') or 14)
          TOKEN = os.environ['GH_TOKEN']

          # Both charts are pinned right below their renovate annotation; anchor on
          # the annotation so unrelated `version:` keys in the file are left alone.
          VERSION_RE = re.compile(
              r'(# renovate: datasource=helm registryUrl=https://helm\.linkerd\.io/edge'
              r' packageName=linkerd-(?:crds|control-plane)\n\s*version:\s*)(\d+\.\d+\.\d+)')

          def gh(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'gitops-manifests-linkerd-updater',
              })
              return json.loads(urllib.request.urlopen(req).read())

          def key(version):
              return tuple(int(p) for p in version.split('.'))

          def chart_version(tag):
              # edge-26.7.2 -> 2026.7.2 (the chart version published to helm.linkerd.io/edge)
              m = re.fullmatch(r'edge-(\d{2})\.(\d{1,2})\.(\d+)', tag)
              return f'20{m.group(1)}.{int(m.group(2))}.{int(m.group(3))}' if m else None

          def status(body):
              # Rendered as a shields.io badge: .../release_status-RECOMMENDED-lightgreen
              m = re.search(r'release_status-([A-Z_]+)', body or '')
              if m:
                  return m.group(1)
              m = re.search(r'Overall status:\s*\**\s*([A-Z_ ]+)', body or '')
              return m.group(1).strip().replace(' ', '_') if m else None

          def cautions(body):
              m = re.search(r'#+\s*Cautions\s*\n+([\s\S]*?)(?=\n#+\s|\Z)', body or '')
              if not m:
                  return None
              text = m.group(1).strip()
              return None if text.upper() in ('', 'N/A', 'NA', 'NONE') else text

          def output(**kwargs):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  for k, v in kwargs.items():
                      f.write(f'{k}={v}\n')

          src = open(FILE).read()
          pinned = VERSION_RE.findall(src)
          if len(pinned) != 2:
              sys.exit(f'::error::expected 2 pinned linkerd chart versions in {FILE}, found {len(pinned)}')
          current = pinned[0][1]
          if pinned[1][1] != current:
              sys.exit('::error::linkerd-crds and linkerd-control-plane are pinned to different versions')

          now = datetime.now(timezone.utc)
          releases = []
          for r in gh('https://api.github.com/repos/linkerd/linkerd2/releases?per_page=100'):
              if r['draft'] or r['prerelease']:
                  continue
              chart = chart_version(r['tag_name'])
              if not chart:
                  continue
              published = datetime.strptime(r['published_at'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)
              releases.append({
                  'tag': r['tag_name'],
                  'chart': chart,
                  'key': key(chart),
                  'date': published.date().isoformat(),
                  'age': (now - published).days,
                  'status': status(r['body']),
                  'cautions': cautions(r['body']),
                  'url': r['html_url'],
              })
          releases.sort(key=lambda r: r['key'], reverse=True)

          cur_key = key(current)
          target = next((r for r in releases
                         if r['key'] > cur_key
                         and r['status'] == 'RECOMMENDED'
                         and r['age'] >= MIN_AGE_DAYS), None)
          if not target:
              newest = releases[0] if releases else None
              if newest:
                  print(f"No newer RECOMMENDED release. Pinned: {current}. "
                        f"Newest upstream: {newest['tag']} (status: {newest['status'] or 'unset'}, "
                        f"{newest['age']} days old).")
              output(changed='false')
              raise SystemExit(0)

          # The badge and the published chart can drift; never pin a chart that is not there.
          index = urllib.request.urlopen('https://helm.linkerd.io/edge/index.yaml').read().decode()
          for chart in ('linkerd-crds', 'linkerd-control-plane'):
              if f'{chart}-{target["chart"]}.tgz' not in index:
                  sys.exit(f'::error::chart {chart} {target["chart"]} is not published to helm.linkerd.io/edge')

          open(FILE, 'w').write(VERSION_RE.sub(lambda m: m.group(1) + target['chart'], src))

          included = sorted((r for r in releases if cur_key < r['key'] <= target['key']),
                            key=lambda r: r['key'])

          body = [
              f'Updates the Linkerd edge charts from `{current}` to `{target["chart"]}` '
              f'([{target["tag"]}]({target["url"]})).',
              '',
              '| Package | Registry | Change |',
              '|---------|----------|--------|',
          ]
          for chart in ('linkerd-crds', 'linkerd-control-plane'):
              body.append(f'| `{chart}` | https://helm.linkerd.io/edge | `{current}` → `{target["chart"]}` |')
          body += [
              '',
              '### Releases included',
              '',
              '| Release | Date | Status |',
              '|---------|------|--------|',
          ]
          for r in included:
              body.append(f'| [{r["tag"]}]({r["url"]}) | {r["date"]} | {r["status"] or "unset"} |')

          notes = [r for r in included if r['cautions']]
          if notes:
              body += ['', '### ⚠️ Cautions from the release notes', '']
              for r in notes:
                  body.append(f'**{r["tag"]}**')
                  body.append('')
                  body.append(r['cautions'])
                  body.append('')

          body += [
              '',
              '---',
              '',
              f'Opened by the [`Update Linkerd Edge Charts`]'
              f'({os.environ.get("GITHUB_SERVER_URL", "https://github.com")}/'
              f'{os.environ.get("GITHUB_REPOSITORY", "")}/actions/workflows/update-linkerd-edge.yml) '
              f'workflow, which only proposes edge releases marked **RECOMMENDED** in the linkerd2 '
              f'release notes and at least {MIN_AGE_DAYS} days old. Renovate is intentionally '
              f'disabled for these charts.',
              '',
              'Verify the release is still marked RECOMMENDED before merging — the project '
              'sometimes downgrades a release to NOT_RECOMMENDED after publishing.',
          ]
          open(BODY_FILE, 'w').write('\n'.join(body) + '\n')

          print(f'{current} -> {target["chart"]} ({target["tag"]}, {target["age"]} days old)')
          output(changed='true', current=current, version=target['chart'], tag=target['tag'])
          EOF

      - name: Open pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          FILE="oci/linkerd/base/helmrelease.yaml"
          BRANCH="chore/update-linkerd-edge"
          TITLE="feat(linkerd): update linkerd core charts to $VERSION"

          # Blob SHA of the file on the current branch — required by the Contents API
          FILE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE" --jq '.sha')

          # Create or force-reset the branch to the current HEAD (main)
          HEAD_SHA=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BRANCH" -f sha="$HEAD_SHA" 2>/dev/null || \
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
            -X PATCH -f sha="$HEAD_SHA" -F force=true

          # Commit via the Contents API — GitHub signs these commits automatically
          CONTENT_B64=$(base64 -w0 < "$FILE")
          gh api "repos/$GITHUB_REPOSITORY/contents/$FILE" \
            -X PUT \
            -f message="$TITLE" \
            -f content="$CONTENT_B64" \
            -f branch="$BRANCH" \
            -f sha="$FILE_SHA"

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            # An older proposal is still open — retarget it at the new version
            gh pr edit "$PR" --title "$TITLE" --body-file pr-body.md
          else
            gh pr create \
              --title "$TITLE" \
              --body-file pr-body.md \
              --base main \
              --head "$BRANCH"
          fi
