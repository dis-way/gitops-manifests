# Replaces kubernetes_secret.accesstokencredentials in the terraform aks-apps-resources
# module, which needed kubeconfig access to the cluster.
#
# The Key Vault secret holds filebase64() of the .pfx, i.e. base64 text rather than the
# certificate bytes. decodingStrategy: Base64 makes ESO decode it before writing, so the
# mounted file is the raw PKCS#12 DER - byte for byte what terraform's binary_data
# produced. Without it the mounted file would be the base64 text and every consumer would
# fail to parse the certificate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accesstoken
  namespace: default
  annotations:
    # creationPolicy Owner: pruning this ExternalSecret also deletes the Secret the apps
    # mount, so keep it if the Kustomization is deleted or recreated.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: altinn-keyvault-store
  target:
    name: accesstoken
    creationPolicy: Owner
  data:
    - secretKey: accesstokencredentials.pfx
      remoteRef:
        key: accesstokencredentials
        decodingStrategy: Base64
