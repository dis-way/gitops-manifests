# Replaces kubernetes_secret.altinn-appsettings-secret in the terraform aks-apps-resources
# module, the last resource there that needed kubeconfig access to the cluster.
#
# The vault value is the kvSetting document the Altinn apps read to reach the service
# owner's Key Vault, written by azurerm_key_vault_secret.altinn_appsettings. It is stored
# as plain JSON, so it passes through unchanged - no decodingStrategy here, unlike
# accesstoken, whose vault value is base64 because it comes from filebase64().
#
# The Key Vault secret name cannot contain a dot, so the vault key and the key inside the
# Secret differ: altinn-appsettings-secret -> altinn-appsettings-secret.json.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: altinn-appsettings-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: altinn-keyvault-store
  target:
    name: altinn-appsettings-secret
    creationPolicy: Owner
  data:
    - secretKey: altinn-appsettings-secret.json
      remoteRef:
        key: altinn-appsettings-secret
