apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: monitoring
  labels:
    azure.workload.identity/use: "true"
spec:
  env:
    - name: APPLICATIONINSIGHTS_CONNECTION_STRING
      valueFrom:
        secretKeyRef:
          name: app-insights-connstring
          key: connectionString
    # Lets the GC work harder before memory_limiter starts refusing data.
    - name: GOMEMLIMIT
      value: 1600MiB
  # renovate: datasource=docker depName=ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  image: altinncr.azurecr.io/ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.2
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    linkerd.io/inject: "enabled"
    config.linkerd.io/skip-outbound-ports: "443"
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  mode: deployment
  upgradeStrategy: automatic
  serviceAccount: otel-collector
  observability:
    metrics:
      disablePrometheusAnnotations: true
      # The operator's ServiceMonitor is monitoring.coreos.com, which AKS never
      # reads. The otelcol job in prometheus/pods scrapes :8888 instead.
      enableMetrics: false
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/pods:
        config:
          scrape_configs:
            - job_name: pods
              scrape_interval: 30s
              scrape_timeout: 10s
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      label: dis.otel/scrape=true
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: metrics
                  action: keep
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_init]
                  regex: "true"
                  action: drop
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
            - job_name: caches
              scrape_interval: 30s
              scrape_timeout: 10s
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      label: valkey.io/cluster
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: metrics
                  action: keep
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_init]
                  regex: "true"
                  action: drop
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_label_valkey_io_cluster]
                  target_label: cache
            # The collector's own telemetry (service.telemetry below).
            - job_name: otelcol
              scrape_interval: 30s
              scrape_timeout: 10s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [monitoring]
                  selectors:
                    - role: pod
                      label: app.kubernetes.io/name=otel-collector
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "8888"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
    extensions:
      azureauth:
        scopes:
          - https://monitor.azure.com/.default
        workload_identity:
          tenant_id: "$${env:AZURE_TENANT_ID}"
          client_id: "$${env:AZURE_CLIENT_ID}"
          federated_token_file: "$${env:AZURE_FEDERATED_TOKEN_FILE}"
    processors:
      batch: {}
      # The otel-operator's SDK injection (Instrumentation/cluster) always sets
      # service.namespace to the pod's namespace, and both exporters fold it into
      # the service's identity: azuremonitor makes cloud_RoleName
      # "<namespace>.<name>", prometheusremotewrite makes job "<namespace>/<name>".
      # Dropping it keeps a service under the name it had before it opted in.
      #
      # Runs before k8sattributes, so the k8s.namespace.name it compares against
      # can only have come from the SDK itself - in practice, from the operator.
      transform/servicenamespace:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - delete_key(attributes, "service.namespace") where attributes["service.namespace"] != nil and attributes["service.namespace"] == attributes["k8s.namespace.name"]
        log_statements:
          - context: resource
            statements:
              - delete_key(attributes, "service.namespace") where attributes["service.namespace"] != nil and attributes["service.namespace"] == attributes["k8s.namespace.name"]
        metric_statements:
          - context: resource
            statements:
              - delete_key(attributes, "service.namespace") where attributes["service.namespace"] != nil and attributes["service.namespace"] == attributes["k8s.namespace.name"]
      # Extract aks cluster name
      resourcedetection/aks:
        detectors: [aks]
        timeout: 2s
        override: false
        aks:
          resource_attributes:
            k8s.cluster.name:
              enabled: true
      # Extract k8s attributes
      k8sattributes:
        auth_type: 'serviceAccount'
        wait_for_metadata: true
        wait_for_metadata_timeout: 10s
        extract:
          metadata: # extracted from the pod
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.daemonset.name
            - k8s.node.name
            - service.name
            # Keep this list explicit and without service.namespace: k8sattributes
            # would re-add the value transform/servicenamespace drops.
          labels:
            - tag_name: dis.otel.sampling
              key: dis.otel/sampling
              from: deployment
        pod_association:
          - sources:
              # This rule associates all resources containing the 'k8s.pod.ip' attribute with the matching pods. If this attribute is not present in the resource, this rule will not be able to find the matching pod.
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              # This rule associates all resources containing the 'k8s.pod.uid' attribute with the matching pods. If this attribute is not present in the resource, this rule will not be able to find the matching pod.
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      # Remove process.command_args
      transform/drop:
        log_statements:
          - context: log
            statements:
              - delete_key(attributes, "process.command_args")
              - delete_key(resource.attributes, "process.command_args")
              - delete_key(attributes, "instrumentationlibrary.name")
              - delete_key(resource.attributes, "instrumentationlibrary.name")
              - set(instrumentation_scope.name, "")
              - set(instrumentation_scope.version, "")
              - delete_key(attributes, "network.peer.port")
              - delete_key(resource.attributes, "network.peer.port")
              - delete_key(attributes, "network.protocol.version")
              - delete_key(resource.attributes, "network.protocol.version")
              - delete_key(attributes, "os.description")
              - delete_key(resource.attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(resource.attributes, "os.type")
              - delete_key(attributes, "process.executable.name")
              - delete_key(resource.attributes, "process.executable.name")
              - delete_key(attributes, "process.executable.path")
              - delete_key(resource.attributes, "process.executable.path")
              - delete_key(attributes, "process.owner")
              - delete_key(resource.attributes, "process.owner")
              - delete_key(attributes, "process.pid")
              - delete_key(resource.attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(resource.attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(resource.attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")
              - delete_key(resource.attributes, "process.runtime.version")
              - delete_key(attributes, "telemetry.sdk.language")
              - delete_key(resource.attributes, "telemetry.sdk.language")
              - delete_key(attributes, "telemetry.sdk.name")
              - delete_key(resource.attributes, "telemetry.sdk.name")
              - delete_key(attributes, "telemetry.sdk.version")
              - delete_key(resource.attributes, "telemetry.sdk.version")
        metric_statements:
          - context: datapoint
            statements:
              - delete_key(attributes, "process.command_args")
              - delete_key(resource.attributes, "process.command_args")
              - delete_key(attributes, "instrumentationlibrary.name")
              - delete_key(resource.attributes, "instrumentationlibrary.name")
              - set(instrumentation_scope.name, "")
              - set(instrumentation_scope.version, "")
              - delete_key(attributes, "network.peer.port")
              - delete_key(resource.attributes, "network.peer.port")
              - delete_key(attributes, "network.protocol.version")
              - delete_key(resource.attributes, "network.protocol.version")
              - delete_key(attributes, "os.description")
              - delete_key(resource.attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(resource.attributes, "os.type")
              - delete_key(attributes, "process.executable.name")
              - delete_key(resource.attributes, "process.executable.name")
              - delete_key(attributes, "process.executable.path")
              - delete_key(resource.attributes, "process.executable.path")
              - delete_key(attributes, "process.owner")
              - delete_key(resource.attributes, "process.owner")
              - delete_key(attributes, "process.pid")
              - delete_key(resource.attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(resource.attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(resource.attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")
              - delete_key(resource.attributes, "process.runtime.version")
              - delete_key(attributes, "telemetry.sdk.language")
              - delete_key(resource.attributes, "telemetry.sdk.language")
              - delete_key(attributes, "telemetry.sdk.name")
              - delete_key(resource.attributes, "telemetry.sdk.name")
              - delete_key(attributes, "telemetry.sdk.version")
              - delete_key(resource.attributes, "telemetry.sdk.version")
        trace_statements:
          - context: span
            statements:
              - delete_key(attributes, "process.command_args")
              - delete_key(resource.attributes, "process.command_args")
              - delete_key(attributes, "instrumentationlibrary.name")
              - delete_key(resource.attributes, "instrumentationlibrary.name")
              - set(instrumentation_scope.name, "")
              - set(instrumentation_scope.version, "")
              - delete_key(attributes, "network.peer.port")
              - delete_key(resource.attributes, "network.peer.port")
              - delete_key(attributes, "network.protocol.version")
              - delete_key(resource.attributes, "network.protocol.version")
              - delete_key(attributes, "os.description")
              - delete_key(resource.attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(resource.attributes, "os.type")
              - delete_key(attributes, "process.executable.name")
              - delete_key(resource.attributes, "process.executable.name")
              - delete_key(attributes, "process.executable.path")
              - delete_key(resource.attributes, "process.executable.path")
              - delete_key(attributes, "process.owner")
              - delete_key(resource.attributes, "process.owner")
              - delete_key(attributes, "process.pid")
              - delete_key(resource.attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(resource.attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(resource.attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")
              - delete_key(resource.attributes, "process.runtime.version")
              - delete_key(attributes, "telemetry.sdk.language")
              - delete_key(resource.attributes, "telemetry.sdk.language")
              - delete_key(attributes, "telemetry.sdk.name")
              - delete_key(resource.attributes, "telemetry.sdk.name")
              - delete_key(attributes, "telemetry.sdk.version")
              - delete_key(resource.attributes, "telemetry.sdk.version")
          - context: spanevent
            statements:
              - delete_key(attributes, "process.command_args")
              - delete_key(resource.attributes, "process.command_args")
              - delete_key(attributes, "instrumentationlibrary.name")
              - delete_key(resource.attributes, "instrumentationlibrary.name")
              - set(instrumentation_scope.name, "")
              - set(instrumentation_scope.version, "")
              - delete_key(attributes, "network.peer.port")
              - delete_key(resource.attributes, "network.peer.port")
              - delete_key(attributes, "network.protocol.version")
              - delete_key(resource.attributes, "network.protocol.version")
              - delete_key(attributes, "os.description")
              - delete_key(resource.attributes, "os.description")
              - delete_key(attributes, "os.type")
              - delete_key(resource.attributes, "os.type")
              - delete_key(attributes, "process.executable.name")
              - delete_key(resource.attributes, "process.executable.name")
              - delete_key(attributes, "process.executable.path")
              - delete_key(resource.attributes, "process.executable.path")
              - delete_key(attributes, "process.owner")
              - delete_key(resource.attributes, "process.owner")
              - delete_key(attributes, "process.pid")
              - delete_key(resource.attributes, "process.pid")
              - delete_key(attributes, "process.runtime.description")
              - delete_key(resource.attributes, "process.runtime.description")
              - delete_key(attributes, "process.runtime.name")
              - delete_key(resource.attributes, "process.runtime.name")
              - delete_key(attributes, "process.runtime.version")
              - delete_key(resource.attributes, "process.runtime.version")
              - delete_key(attributes, "telemetry.sdk.language")
              - delete_key(resource.attributes, "telemetry.sdk.language")
              - delete_key(attributes, "telemetry.sdk.name")
              - delete_key(resource.attributes, "telemetry.sdk.name")
              - delete_key(attributes, "telemetry.sdk.version")
              - delete_key(resource.attributes, "telemetry.sdk.version")
      # DIS platform specific transformations
      transform/dis:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
            # Ensure otel sampling suggestion is set
            - set(attributes["dis.otel.sampling"], resource.attributes["dis.otel.sampling"]) where resource.attributes["dis.otel.sampling"] != nil
            - set(attributes["dis.otel.sampling"], "minimum") where attributes["dis.otel.sampling"] == nil
      # Envoy still tags spans with the pre-1.0 OpenTracing names - http.method,
      # http.url, http.status_code - and emits every one of them as a string
      # (envoyproxy/envoy#30821). The azuremonitor exporter only reads the
      # stable semantic conventions, and it needs http.request.method just to
      # classify a span as HTTP at all. Untranslated, an envoy-proxy request
      # reaches Application Insights as a request literally named "ingress",
      # with no URL, no client IP, and a resultCode taken from the span status
      # ("0"/"2") rather than the HTTP status. Translating the tags here is what
      # makes envoy requests render like the traefik ones.
      #
      # Runs before transform/azuremonitor, which re-derives the legacy names as
      # custom dimensions from whatever this produces.
      transform/envoy:
        error_mode: ignore
        trace_statements:
          - context: span
            conditions:
              # Envoy sets component=proxy on every span it produces, for both
              # the downstream (ingress) and the upstream (egress) side. It is a
              # more stable marker than the generated envoy Deployment name.
              - attributes["component"] == "proxy"
            statements:
              - set(attributes["http.request.method"], attributes["http.method"]) where attributes["http.method"] != nil
              # Int(): envoy sends the status as the string "200", and the
              # exporter reads http.response.status_code as an integer - a
              # string leaves it at 0 and the request is reported as a failure.
              - set(attributes["http.response.status_code"], Int(attributes["http.status_code"])) where attributes["http.status_code"] != nil
              # "-" is envoy's placeholder for a header that was not sent.
              - set(attributes["user_agent.original"], attributes["user_agent"]) where attributes["user_agent"] != nil and attributes["user_agent"] != "-"
              # On an ingress span peer.address is the downstream client. On an
              # egress span it is the upstream host, which is not a client IP.
              - set(attributes["client.address"], attributes["peer.address"]) where attributes["peer.address"] != nil and kind == SPAN_KIND_SERVER
              # http.url is the full original URI and is only set on ingress
              # spans. Split it so the exporter can rebuild the request URL.
              # Note envoy truncates it at 256 characters by default.
              - set(attributes["url.full"], attributes["http.url"]) where attributes["http.url"] != nil
              # Parse once into cache. A missing key read from a path (cache) is
              # nil, while indexing URL() directly errors with "key not found"
              # for every URL without a query string.
              - set(cache["url"], URL(attributes["http.url"])) where attributes["http.url"] != nil
              - set(attributes["url.scheme"], cache["url"]["url.scheme"]) where cache["url"]["url.scheme"] != nil
              - set(attributes["url.path"], cache["url"]["url.path"]) where cache["url"]["url.path"] != nil
              - set(attributes["url.query"], cache["url"]["url.query"]) where cache["url"]["url.query"] != nil
              # server.address normally arrives as an envoy tag (see the
              # EnvoyProxy telemetry.tracing.tags block); this covers proxies
              # that do not set it.
              - set(attributes["server.address"], cache["url"]["url.domain"]) where attributes["server.address"] == nil and cache["url"]["url.domain"] != nil
      # Hack to make azure application insights display traces somewhat correctly
      transform/azuremonitor:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
            # http.host fix
            - set(attributes["http.host"], attributes["server.address"]) where attributes["server.address"] != nil
            # http.method fix
            - set(attributes["http.method"], attributes["http.request.method"]) where attributes["http.request.method"] != nil
            # http.scheme fix
            - set(attributes["http.scheme"], attributes["url.scheme"]) where attributes["url.scheme"] != nil
            # http.target fix
            - set(attributes["http.target"], attributes["url.path"]) where attributes["url.path"] != nil and (attributes["url.query"] == nil or attributes["url.query"] == "")
            - set(attributes["http.target"], Concat([attributes["url.path"], attributes["url.query"]], "?")) where attributes["url.path"] != nil and (attributes["url.query"] != nil and attributes["url.query"] != "")
            # http.url fix
            - set(attributes["http.url"], attributes["url.full"]) where attributes["url.full"] != nil and attributes["http.url"] == nil
            # http.status_code fix
            - set(attributes["http.status_code"], attributes["http.response.status_code"]) where attributes["http.response.status_code"] != nil
            # http.client_ip fix
            - set(attributes["http.client_ip"], attributes["client.address"]) where attributes["client.address"] != nil
            # db.statement fix
            - set(attributes["db.statement"], attributes["sql.query.text"]) where attributes["sql.query.text"] != nil
            # db.system fix
            - set(attributes["db.system"], attributes["db.system.name"]) where attributes["db.system.name"] != nil
            # set http.route to url.path if deployment traefik and url.full not set
            - set(attributes["http.route"], attributes["url.path"]) where attributes["url.path"] != nil and attributes["http.route"] == nil
            # Application Insights uses http.route as the operation name, so an
            # ingress proxy that sees every path in the cluster has to be cut
            # down to the first two segments or the operation list is one entry
            # per resource id. component=proxy is envoy, which needs the same
            # treatment as traefik now that its spans carry a url.path.
            - replace_pattern(attributes["http.route"], "/(.*?)/(.*?)?/(.*?)?$","/$$1/$$2") where (resource.attributes["k8s.deployment.name"] == "traefik" or attributes["component"] == "proxy") and attributes["http.route"] != nil
            # The "Internal Identity" (Service Mesh Fix)
            - set(attributes["http.host"], resource.attributes["service.name"]) where resource.attributes["linkerd.io/proxy-deployment"] != nil
            - set(attributes["http.target"], resource.attributes["service.name"]) where resource.attributes["linkerd.io/proxy-deployment"] != nil
            - set(attributes["server.address"], resource.attributes["service.name"]) where resource.attributes["linkerd.io/proxy-deployment"] != nil
      # Envoy spans end up with every HTTP attribute twice: envoy's own
      # OpenTracing tags, the stable names transform/envoy copies them to, and
      # the legacy names transform/azuremonitor derives back. The exporter
      # (v0.161) builds Url, Name, ResultCode, Success and ClientIP from the
      # stable names only and copies the rest into custom dimensions, so the
      # legacy copies are just bytes. Runs after transform/azuremonitor.
      transform/envoy-dedupe:
        error_mode: ignore
        trace_statements:
          - context: span
            conditions:
              - attributes["component"] == "proxy"
            statements:
              - delete_key(attributes, "http.url")
              - delete_key(attributes, "http.target")
              - delete_key(attributes, "http.host")
              - delete_key(attributes, "http.client_ip")
              - delete_key(attributes, "http.method")
              - delete_key(attributes, "http.status_code")
              - delete_key(attributes, "http.scheme")
              # Copied to user_agent.original by transform/envoy.
              - delete_key(attributes, "user_agent")
              # Envoy's node id is the pod name, already in k8s.pod.name.
              - delete_key(attributes, "node_id")
              - delete_key(attributes, "k8s.pod.uid")
              - delete_key(resource.attributes, "k8s.pod.uid")
      # map metric attributes and remove a set of attributes
      transform/metrics:
        metric_statements:
          - context: datapoint
            statements:
              - merge_maps(attributes, resource.attributes, "insert")
              # Remove the specific attributes with little value
              - delete_key(attributes, "telemetry.sdk.language")
              - delete_key(attributes, "telemetry.sdk.name")
              - delete_key(attributes, "process.command_args")
              - delete_key(attributes, "os.type")
              - delete_key(attributes, "os.description")
      # num_traces must exceed new traces/s x decision_wait, or traces are evicted
      # before any policy runs, errors included. 50000 covers ~5000 traces/s.
      # Only sampled decisions are cached: a late root span of an unsampled trace
      # is still judged on its own by the error and latency policies.
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        decision_cache:
          sampled_cache_size: 100000
        policies:
          - name: default
            type: and
            and:
              and_sub_policy:
                - name: not-route-live-ready-policy
                  type: string_attribute
                  string_attribute:
                    key: http.route
                    values: 
                      - "^/metrics"
                      - "^/health"
                      - "^/kuberneteswrapper/.*"
                    invert_match: true
                    enabled_regex_matching: true
                - name: not-all-sampling-attr
                  type: string_attribute
                  string_attribute:
                    key: dis.otel.sampling
                    values: [all]
                    invert_match: true
                - name: probabilistic-policy
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 1
          - name: sample-all
            type: and
            and:
              and_sub_policy:
                - name: not-route-live-ready-policy
                  type: string_attribute
                  string_attribute:
                    key: http.route
                    values: 
                      - "^/metrics"
                      - "^/health"
                      - "^/kuberneteswrapper/.*"
                    invert_match: true
                    enabled_regex_matching: true
                - name: all-sampling-attr
                  type: string_attribute
                  string_attribute:
                    key: dis.otel.sampling
                    values: [all]
                - name: probabilistic-policy
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 100
          - name: heavy-sampling
            type: and
            and:
              and_sub_policy:
                - name: route-live-ready-policy
                  type: string_attribute
                  string_attribute:
                    key: http.route
                    values: 
                      - "^/metrics"
                      - "^/health"
                      - "^/kuberneteswrapper/.*"
                    enabled_regex_matching: true
                  # apply probabilistic sampling
                - name: probabilistic-policy
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 0.1
          # Envoy sets ERROR on every 4xx span (ingress and egress), so a single
          # 400/404 would keep a whole fan-out trace of hundreds of spans. Envoy
          # 4xx are sampled by sample-envoy-4xx instead; every other ERROR span,
          # including Envoy 5xx, still keeps its trace.
          - name: always-sample-errors
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - >-
                  status.code == STATUS_CODE_ERROR and not (attributes["component"] == "proxy"
                  and attributes["http.response.status_code"] >= 400
                  and attributes["http.response.status_code"] < 500)
          # 10% of traces with an Envoy 4xx, the same rate the access logs keep.
          # http.response.status_code is an int, set by transform/envoy.
          - name: sample-envoy-4xx
            type: and
            and:
              and_sub_policy:
                - name: envoy-4xx-policy
                  type: ottl_condition
                  ottl_condition:
                    error_mode: ignore
                    span:
                      - >-
                        attributes["component"] == "proxy"
                        and attributes["http.response.status_code"] >= 400
                        and attributes["http.response.status_code"] < 500
                - name: probabilistic-policy
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 10
          - name: always-sample-slow-requests
            type: latency
            latency:
              threshold_ms: 1000
      # Envoy access logs (failed requests only, see oci/envoy-gateway) arrive
      # without a severity and would be dropped by filter/logs. 5xx and
      # connection failures become ERROR, 4xx WARN and sampled to 10%.
      transform/envoy-accesslog:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - resource.attributes["dis.otel.logtype"] == "envoy-access"
            statements:
              - set(severity_number, SEVERITY_NUMBER_ERROR)
              - set(severity_text, "ERROR")
              - set(severity_number, SEVERITY_NUMBER_WARN) where Int(attributes["response_code"]) >= 400 and Int(attributes["response_code"]) < 500
              - set(severity_text, "WARN") where severity_number == SEVERITY_NUMBER_WARN
              - set(attributes["sampling.priority"], 10) where severity_number == SEVERITY_NUMBER_WARN
              # Envoy sends %TRACE_ID% as an attribute. On the record it becomes
              # operation_Id, which joins the line to its request in App Insights.
              - set(trace_id.string, attributes["trace_id"]) where attributes["trace_id"] != nil and attributes["trace_id"] != "-" and attributes["trace_id"] != ""
              # Envoy's JSON access logs have no body, and Application Insights
              # drops traces without a message. Build a one-line summary.
              # Listener records have no request; Envoy sends method as "-".
              - set(body, Concat([attributes["response_code"], attributes["response_flags"], attributes["method"], attributes["authority"], attributes["path"]], " ")) where attributes["method"] != nil and attributes["method"] != "-"
              - set(body, Concat(["connection failed", attributes["downstream_transport_failure_reason"], attributes["connection_termination_details"]], " ")) where attributes["method"] == nil or attributes["method"] == "-"
      # Only records carrying sampling.priority are sampled; everything else
      # is kept. fail_closed: false keeps records without a trace ID.
      probabilistic_sampler/logs:
        sampling_percentage: 100
        sampling_priority: sampling.priority
        fail_closed: false
      # Strip the sampling hint and the sampler's own attributes before export.
      transform/envoy-accesslog-cleanup:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - delete_matching_keys(attributes, "^sampling[.]")
      filter/logs:
        error_mode: ignore
        logs:
          log_record:
          - 'severity_number < SEVERITY_NUMBER_WARN' #Drop all Info, debug, trace and unspecified logs
          - 'attributes["error"] == "secret default/ssl-cert does not exist"' # Remove noisy logs from traefik that is there due to some legacy configuration that does not affect the service
      # Application Insights drops traces without a message, e.g. Traefik's
      # `ERR error=...` lines. Use the error, or a placeholder.
      transform/empty-body:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(body, attributes["error"]) where (body == nil or body == "") and attributes["error"] != nil
              - set(body, "(no message)") where body == nil or body == ""
      # Memory limiter to mitigate out of memory situations
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

    # Envoy access logs get their own pipeline so the sampler never touches
    # other applications' logs.
    connectors:
      routing/logs:
        default_pipelines: [logs]
        table:
          - condition: resource.attributes["dis.otel.logtype"] == "envoy-access"
            pipelines: [logs/envoy-access]
    exporters:
      azuremonitor: {}
      debug: {}
      prometheusremotewrite:
        endpoint: ${AMW_WRITE_ENDPOINT}
        # Keep scope name/version out of the series as otel_scope_* labels.
        disable_scope_info: true
        auth:
          authenticator: azureauth

    service:
      extensions: [azureauth]
      telemetry:
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    # Since 0.152 an explicit host drops units, _total and scope
                    # info from the collector's own metric names. Keep the old names.
                    without_type_suffix: false
                    without_units: false
                    without_scope_info: false
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/servicenamespace, resourcedetection/aks, k8sattributes, transform/envoy, transform/azuremonitor, transform/drop, transform/envoy-dedupe, transform/dis, tail_sampling, batch]
          exporters: [azuremonitor]
        logs/in:
          receivers: [otlp]
          processors: [memory_limiter, transform/servicenamespace]
          exporters: [routing/logs]
        logs:
          receivers: [routing/logs]
          processors: [filter/logs, transform/empty-body, resourcedetection/aks, k8sattributes, transform/drop, batch]
          exporters: [azuremonitor]
        logs/envoy-access:
          receivers: [routing/logs]
          processors: [transform/envoy-accesslog, probabilistic_sampler/logs, transform/envoy-accesslog-cleanup, resourcedetection/aks, k8sattributes, transform/drop, batch]
          exporters: [azuremonitor]
        metrics:
          receivers: [otlp, prometheus/pods]
          processors: [memory_limiter, transform/servicenamespace, resourcedetection/aks, k8sattributes, transform/metrics, transform/drop, batch]
          exporters: [prometheusremotewrite]
