# The otel-azure-kv-store SecretStore in monitoring cannot serve flux-system.
# A ClusterSecretStore can reference the otel-collector ServiceAccount in
# monitoring, so it reuses that identity's existing federated credential.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: otel-azure-kv-store
spec:
  conditions:
    - namespaces:
        - flux-system
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${KV_URI}
      serviceAccountRef:
        name: otel-collector
        namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-insights-connstring-external-secret
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: otel-azure-kv-store
  target:
    name: app-insights-connstring
    creationPolicy: Owner
  data:
    - secretKey: connectionString           # key inside the k8s Secret
      remoteRef:
        key: connectionString
