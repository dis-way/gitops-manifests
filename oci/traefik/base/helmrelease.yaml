apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: altinn-traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      # renovate: datasource=helm registryUrl=https://traefik.github.io/charts packageName=traefik
      version: 41.6.1
  interval: 1h
  timeout: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    image:
      registry: altinncr.azurecr.io
    deployment:
      replicas: 3
      labels:
        release: traefik
      podAnnotations:
        linkerd.io/inject: enabled
        config.linkerd.io/skip-inbound-ports: 8000,8443,9100
        config.linkerd.io/proxy-cpu-request: 50m
        config.linkerd.io/proxy-memory-limit: 250Mi
        config.linkerd.io/proxy-memory-request: 40Mi
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    # At most one pod down at a time during node drains and upgrades
    # (minAvailable: 1 allowed 2 of 3 pods to be evicted at once).
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # Ingress for the whole cluster: do not preempt or evict before app pods.
    priorityClassName: system-cluster-critical
    ingressClass:
      enabled: false
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: false
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    ports:
      # Default Traefik ports (web:80, websecure:443) are disabled in favor of custom ports
      # This allows for custom port configuration with specific networking requirements
      web: null
      websecure: null
      # Custom HTTP port configuration (maps internal 8000 to external 80)
      http:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        protocol: TCP
        # With externalTrafficPolicy: Local the Azure LB only stops sending to a node
        # once its healthCheckNodePort probe fails. Keep accepting requests after
        # SIGTERM until then, so terminating pods drain without connection resets.
        transport:
          lifeCycle:
            requestAcceptGraceTimeout: 15s
        http:
          redirections:
            entryPoint:
              to: https
              scheme: https
              permanent: true
        forwardedHeaders:
          insecure: false
          trustedIPs:
            - "${AKS_VNET_IPV4_CIDR}"
            - "${AKS_VNET_IPV6_CIDR}"
      https:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        protocol: TCP
        transport:
          lifeCycle:
            requestAcceptGraceTimeout: 15s
        forwardedHeaders:
          insecure: false
          trustedIPs:
            - "${AKS_VNET_IPV4_CIDR}"
            - "${AKS_VNET_IPV6_CIDR}"
        http:
          tls:
            enabled: true
            options: ""
            certResolver: ""
            domains: []
    tlsOptions:
      default:
        minVersion: VersionTLS12
        cipherSuites:
          - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256
    tlsStore:
      default:
        defaultCertificate:
          secretName: ssl-cert
    service:
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-resource-group: "${AKS_NODE_RG}"
        service.beta.kubernetes.io/azure-load-balancer-ipv4: "${PUBLIC_IP_V4}"
        service.beta.kubernetes.io/azure-load-balancer-ipv6: "${PUBLIC_IP_V6}"
      spec:
        externalTrafficPolicy: "${EXTERNAL_TRAFFIC_POLICY:=Local}"
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv4
          - IPv6
    resources:
      requests:
        cpu: "100m"
        memory: "100Mi"
    experimental:
      otlpLogs: true
    metrics:
      prometheus: null
      otlp:
        enabled: true
        pushInterval: 60s
        grpc:
          enabled: true
          endpoint: "${OTEL_ENDPOINT:=otel-collector.monitoring.svc.cluster.local:4317}"
          insecure: true
    tracing:
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: "${OTEL_ENDPOINT:=otel-collector.monitoring.svc.cluster.local:4317}"
          insecure: true
    log:
      level: "ERROR"
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: "${OTEL_ENDPOINT:=otel-collector.monitoring.svc.cluster.local:4317}"
          insecure: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - traefik
              topologyKey: kubernetes.io/hostname
    # Spread pods across availability zones. ScheduleAnyway: never blocks
    # scheduling. matchLabelKeys counts only pods of the same ReplicaSet.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        matchLabelKeys:
          - pod-template-hash
    extraObjects: []
