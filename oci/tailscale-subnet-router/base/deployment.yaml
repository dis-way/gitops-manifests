apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: tailscale-subnet-router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      serviceAccountName: tailscale
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: system-cluster-critical
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      containers:
        - name: tailscale
          # renovate: datasource=docker depName=tailscale/tailscale
          image: altinncr.azurecr.io/docker.io/tailscale/tailscale:v1.102.5
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-authkey
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.altinn.cloud"
            - name: TS_ROUTES
              value: "${TS_ADVERTISE_ROUTES:=}"
            - name: TS_USERSPACE
              value: "true"
            - name: TS_KUBE_SECRET
              value: "tailscale-state"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_HOSTNAME
              value: "${AKS_NAME}"
            # Headscale does not collect client logs; without this tailscaled
            # uploads them to log.tailscale.com.
            - name: TS_NO_LOGS_NO_SUPPORT
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
          livenessProbe:
            exec:
              command:
                - tailscale
                - status
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - tailscale
                - status
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # tailscaled answers pings to subnet routes by running ping,
              # which needs raw ICMP sockets.
              add:
                - NET_RAW
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: root-cache
              mountPath: /root/.cache
            - name: var-run-tailscale
              mountPath: /var/run/tailscale
      volumes:
        - name: tmp
          emptyDir: {}
        - name: root-cache
          emptyDir: {}
        - name: var-run-tailscale
          emptyDir: {}
