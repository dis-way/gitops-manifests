# Input variables for the tailscale-subnet-router Flux Kustomization, read
# through postBuild.substituteFrom. dis-system-store is a namespaced SecretStore
# in flux-system, and substituteFrom only reads Secrets from the Kustomization's
# own namespace, so both this ExternalSecret and its Secret live there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-subnet-router-vars
  namespace: flux-system
  annotations:
    # The Kustomization for . depends on the Secret, which External Secrets
    # deletes together with this ExternalSecret
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-system-store
  target:
    name: tailscale-subnet-router-vars
    creationPolicy: Owner
  # Key Vault secret names allow only alphanumerics and dashes, so each one is
  # mapped to its variable name explicitly.
  data:
    - secretKey: AKS_NAME
      remoteRef:
        key: tailscale-subnet-router-aks-name
    - secretKey: TS_ADVERTISE_ROUTES
      remoteRef:
        key: tailscale-subnet-router-ts-advertise-routes
    - secretKey: HEADSCALE_PREAUTH_KEY
      remoteRef:
        key: tailscale-subnet-router-headscale-preauth-key
