apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headscale
  namespace: headscale
spec:
  parentRefs:
    - name: headscale
      sectionName: https
  hostnames:
    - headscale.altinn.cloud
  rules:
    # Do not publish the API documentation. Redirect instead of a Traefik
    # middleware to stay on standard Gateway API resources.
    - matches:
        - path:
            type: PathPrefix
            value: /swagger
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headscale
          port: 8080
