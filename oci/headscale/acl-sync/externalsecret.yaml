# The ACL policy rendered by tf/adminservices-prod/headscale-access in
# dis-way/adminservices. dis-system-store is a namespaced SecretStore in
# flux-system, so this ExternalSecret and its Secret live there, and the
# CronJob reads the Secret through a Role scoped to it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-acl
  namespace: flux-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: dis-system-store
  target:
    name: headscale-acl
    creationPolicy: Owner
  data:
    - secretKey: acl.hujson
      remoteRef:
        key: headscale-acl
