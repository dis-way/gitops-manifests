apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apps clusters: no cert-manager Let's Encrypt issuer. The Gateway uses the
# cluster wildcard certificate (ssl-cert, *.apps.altinn.no) from the traefik
# namespace, so DERP_HOSTNAME must be a single label under apps.altinn.no.
# Deploy only this path; do not deploy ../post-deploy.
resources:
  - ../base
  - referencegrant.yaml
patches:
  - target:
      kind: Gateway
      name: derper
    patch: |
      - op: replace
        path: /spec/listeners/0/tls/certificateRefs
        value:
          - kind: Secret
            name: ssl-cert
            namespace: traefik
