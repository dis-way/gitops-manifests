# Replaces per-cluster kubernetes_service_account resources (e.g. sfvt's
# dgm-workload-identity.tf), which needed kubeconfig access to the cluster.
#
# One ServiceAccount per rendering - name, namespace and client id all come from
# fluxConfiguration postBuild substitutes, so each identity gets its own kustomization
# entry pointing at this artifact.
#
# The tenant-id annotation is deliberately omitted: the azure-workload-identity webhook
# then injects the cluster's default tenant, which is what the terraform-managed
# ServiceAccounts relied on. Templating it would turn a forgotten substitute into
# AZURE_TENANT_ID="" and break token exchange at runtime instead of at apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${WI_SA_NAME}
  namespace: ${WI_SA_NAMESPACE:=default}
  annotations:
    azure.workload.identity/client-id: "${WI_CLIENT_ID}"
  labels:
    azure.workload.identity/use: "true"
