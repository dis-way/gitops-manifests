apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 1h
  path: ./config/crd/standard
  prune: false
  sourceRef:
    kind: GitRepository
    name: gateway-api
    namespace: flux-system
  timeout: 5m
  wait: true
