apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: legacy-proxies
  namespace: flux-system
spec:
  force: false
  interval: 5m0s
  path: ./envs/${ENVIRONMENT}
  prune: true
  retryInterval: 5m0s
  sourceRef:
    kind: OCIRepository
    name: legacy-proxies
    namespace: flux-system
  targetNamespace: default
  timeout: 5m0s
  wait: true
