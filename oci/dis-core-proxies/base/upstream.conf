# proxy_pass WITHOUT a URI component: nginx forwards the original request URI
# and query string unchanged. Do not append a path here, that would switch
# nginx into rewrite mode.
#
# UPSTREAM_HOSTNAME and UPSTREAM_HOST_HEADER are filled in by Flux postBuild
# substitution. Flux has no strict mode and turns an undefined variable into an
# empty string, so both carry a sentinel default instead: the .invalid TLD never
# resolves, nginx refuses to load the config, and the pod log names the variable
# that was left unset.
proxy_pass https://${UPSTREAM_HOSTNAME:=UPSTREAM-HOSTNAME-NOT-SET.invalid};

# The legacy ingress routes on its own hostname, so rewrite Host. The caller's
# original Host is preserved in X-Forwarded-Host by the shared config.
proxy_set_header Host ${UPSTREAM_HOST_HEADER:=UPSTREAM-HOST-HEADER-NOT-SET.invalid};

# Upstream TLS, verified against the system trust store.
proxy_ssl_server_name         on;
proxy_ssl_name                ${UPSTREAM_HOSTNAME:=UPSTREAM-HOSTNAME-NOT-SET.invalid};
proxy_ssl_verify              on;
proxy_ssl_verify_depth        3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols           TLSv1.2 TLSv1.3;
