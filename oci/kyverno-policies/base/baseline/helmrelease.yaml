apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno-policies
spec:
  chart:
    spec:
      chart: kyverno-policies
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      # renovate: datasource=helm registryUrl=https://kyverno.github.io/kyverno/ packageName=kyverno-policies
      version: 3.9.1
  interval: 1h
  timeout: 5m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    podSecurityStandard: baseline
    podSecuritySeverity: medium
    validationFailureAction: Audit
    background: true
    # Azure-managed: AKS system components and the AKS Flux extension.
    # Kyverno's webhook already skips these; this also keeps them out of background scans.
    vpolExclude:
      excludeNamespaces:
        - kube-system
        - flux-system
