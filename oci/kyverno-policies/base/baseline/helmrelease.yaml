apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno-policies
spec:
  chart:
    spec:
      chart: kyverno-policies
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      # renovate: datasource=helm registryUrl=https://kyverno.github.io/kyverno/ packageName=kyverno-policies
      version: 3.9.1
  interval: 1h
  timeout: 5m
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # Chart 3.9 defaults to CEL ValidatingPolicies, which the kyverno.io/v2
    # PolicyExceptions in ../exceptions do not apply to. Keep the legacy types
    # until we migrate the exceptions.
    policyType: ClusterPolicy
    podSecurityStandard: baseline
    podSecuritySeverity: medium
    validationFailureAction: Audit
    background: true
