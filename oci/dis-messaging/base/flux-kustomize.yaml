apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dis-messaging-operator
  namespace: flux-system
spec:
  force: false
  interval: 5m0s
  path: ./default
  postBuild:
    substitute:
      DISMSG_AZURE_SUBSCRIPTION_ID: ${DISMSG_AZURE_SUBSCRIPTION_ID}
      DISMSG_AZURE_TENANT_ID: ${DISMSG_AZURE_TENANT_ID}
      DISMSG_NAMESPACE_RESOURCE_ID: ${DISMSG_NAMESPACE_RESOURCE_ID}
      DISMSG_ENV: ${DISMSG_ENV}
  prune: false
  retryInterval: 5m0s
  images:
    - name: controller
      newName: altinncr.azurecr.io/ghcr.io/altinn/altinn-platform/dis-messaging-operator
      # renovate: datasource=docker depName=ghcr.io/altinn/altinn-platform/dis-messaging-operator versioning=semver
      newTag: v0.1.0
  sourceRef:
    kind: OCIRepository
    name: dis-messaging-operator
    namespace: flux-system
  targetNamespace: dis-messaging-operator-system
  timeout: 5m0s
  wait: true
