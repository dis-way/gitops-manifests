apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dis-cache-operator
  namespace: flux-system
spec:
  force: false
  interval: 5m0s
  path: ./default
  patches:
    - target:
        kind: Deployment
        name: dis-cache-operator-controller-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: dis-cache-operator-controller-manager
        spec:
          template:
            spec:
              containers:
                - name: manager
                  env:
                    - name: DISCACHE_VALKEY_IMAGE
                      # renovate: datasource=docker depName=valkey/valkey
                      value: altinncr.azurecr.io/docker.io/valkey/valkey:9.0.0
                    - name: DISCACHE_EXPORTER_IMAGE
                      # renovate: datasource=docker depName=oliver006/redis_exporter
                      value: altinncr.azurecr.io/docker.io/oliver006/redis_exporter:v1.80.0
  prune: false
  retryInterval: 5m0s
  images:
    - name: controller
      newName: altinncr.azurecr.io/ghcr.io/altinn/altinn-platform/dis-cache-operator
      # renovate: datasource=docker depName=ghcr.io/altinn/altinn-platform/dis-cache-operator versioning=semver
      newTag: v0.1.0
  sourceRef:
    kind: OCIRepository
    name: dis-cache-operator
    namespace: flux-system
  targetNamespace: dis-cache-operator-system
  timeout: 5m0s
  wait: true
