apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: OCIRepository
      name: dis-cache-operator
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-system
  - target:
      kind: Kustomization
      name: dis-cache-operator
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-system
      - op: replace
        path: /spec/sourceRef/namespace
        value: platform-system
      - op: add
        path: /spec/dependsOn
        value:
          - name: valkey-operator-valkey-operator
            namespace: platform-system
