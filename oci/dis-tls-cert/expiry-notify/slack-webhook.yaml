apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dis-tls-cert-expiry-slack-webhook
  namespace: dis-tls-cert
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-tls-cert-store
  target:
    name: dis-tls-cert-expiry-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: cert-expiry-slack-webhook-url
