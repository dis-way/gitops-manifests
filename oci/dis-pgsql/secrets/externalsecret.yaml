# This ExternalSecret supplies the input variables for the dis-pgsql Flux
# Kustomization. The Kustomization reads them through postBuild.substituteFrom.
# dis-system-store is a namespaced SecretStore in flux-system.
# substituteFrom only reads Secrets from the Kustomization's own namespace.
# This ExternalSecret and its Secret therefore live in flux-system.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dis-pgsql-vars
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-system-store
  target:
    name: dis-pgsql-vars
    creationPolicy: Owner
  # Key Vault secret names allow only alphanumerics and dashes. Each name maps
  # to its variable name explicitly.
  data:
    - secretKey: DISPG_AZURE_SUBSCRIPTION_ID
      remoteRef:
        key: dis-pgsql-azure-subscription-id
    - secretKey: DISPG_AZURE_TENANT_ID
      remoteRef:
        key: dis-pgsql-azure-tenant-id
    - secretKey: DISPG_DB_RESOURCE_GROUP
      remoteRef:
        key: dis-pgsql-db-resource-group
    - secretKey: DISPG_DB_VNET_NAME
      remoteRef:
        key: dis-pgsql-db-vnet-name
    - secretKey: DISPG_AKS_VNET_NAME
      remoteRef:
        key: dis-pgsql-aks-vnet-name
    - secretKey: DISPG_AKS_RESOURCE_GROUP
      remoteRef:
        key: dis-pgsql-aks-resource-group
    - secretKey: DISPG_WORKLOAD_IDENTITY_CLIENT_ID
      remoteRef:
        key: dis-pgsql-workload-identity-client-id
    - secretKey: DISPG_CLUSTER_ID
      remoteRef:
        key: dis-pgsql-cluster-id
