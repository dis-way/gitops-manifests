apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: headplane
  namespace: headplane
spec:
  gatewayClassName: traefik
  listeners:
    # https-internal entrypoint: only on the private Traefik Load Balancer,
    # so Headplane is reachable only over the VPN.
    - name: https
      port: 8444
      protocol: HTTPS
      hostname: headplane.altinn.cloud
      tls:
        certificateRefs:
          - name: headplane-tls
      allowedRoutes:
        namespaces:
          from: Same
