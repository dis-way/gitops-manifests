apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: envoy-valkey
spec:
  interval: 5m
  chart:
    spec:
      chart: valkey
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: envoy-valkey
      # renovate: datasource=helm depName=valkey registryUrl=https://valkey.io/valkey-helm/
      version: 0.11.0
  releaseName: valkey
  install:
    crds: Skip
  upgrade:
    crds: Skip
  targetNamespace: envoy-valkey
  values:
    global:
      imageRegistry: altinncr.azurecr.io/docker.io
    podAnnotations:
      # The chart mounts valkey-data as an emptyDir (dataStorage.enabled: false),
      # which otherwise blocks cluster autoscaler scale-down.
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    resources:
      requests:
        cpu: "${VALKEY_CPU_REQUEST:=1}"
        memory: "${VALKEY_MEMORY_REQUEST:=1Gi}"
      limits:
        memory: "${VALKEY_MEMORY_REQUEST:=1Gi}"
    # Opts the pod into the otel-collector's generic pod scrape, which picks
    # up the container port named "metrics" - the redis_exporter below.
    podLabels:
      dis.otel/scrape: "true"
    # redis_exporter sidecar on :9121 (container port "metrics"). The chart's
    # ServiceMonitor/PodMonitor stay off: collection follows the OTel path
    # like the rest of this package. global.imageRegistry also rewrites
    # this image, so it is pulled as docker.io/oliver006/redis_exporter
    # through the mirror (the image is published there as well as on ghcr.io).
    metrics:
      enabled: true
