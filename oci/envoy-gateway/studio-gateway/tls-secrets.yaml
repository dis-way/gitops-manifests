# Same Key Vault and reader identity as tls-cert in default-gateway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-tls-cert
  namespace: envoy-gateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-tls-cert-store
  target:
    name: studio-tls-cert
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: '{{ .crt }}'
        tls.key: '{{ .key }}'
  data:
    - secretKey: crt
      remoteRef:
        key: "${STUDIO_TLS_CRT_SECRET_NAME}"
    - secretKey: key
      remoteRef:
        key: "${STUDIO_TLS_KEY_SECRET_NAME}"
