# :80 -> HTTPS for the studio listener. The Gateway's own redirect is pinned to
# its http listener and does not cover ListenerSets. See
# default-gateway/http-redirect.yaml for why 308 and no port.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: studio-http-to-https
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: studio
      # Without sectionName the route also attaches to :443 and loops.
      sectionName: http
  # edge-route-guard rejects routes without hostnames.
  hostnames:
    - 'studio.platform.${ENVIRONMENT}.altinn.cloud'
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
