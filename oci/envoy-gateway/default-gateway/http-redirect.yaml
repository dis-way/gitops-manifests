apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eg-http-to-https
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      # Pinned to the :80 listener by name. Without sectionName this route
      # would attach to every listener the Gateway has, including :443, and
      # redirect HTTPS traffic to itself in a loop.
      sectionName: http
  # No hostnames: the route inherits the listener's ${BASE_HOSTNAME}. Adding
  # one here would have to intersect the listener hostname or the route is
  # rejected as having no matching host.
  rules:
      # A rule with only filters and no backendRefs is the standard redirect
      # shape - Envoy answers directly, nothing is proxied upstream.
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            # Port is deliberately omitted. Gateway API derives it from the
            # scheme (https -> 443) and, per spec, leaves the port out of the
            # Location header entirely for https/443 - so clients get
            # https://host/path rather than https://host:443/path.
            # HSTS is NOT set here on purpose - RFC 6797 makes user agents
            # ignore Strict-Transport-Security received over plaintext. It
            # lives in client-traffic-policy.yaml, on the HTTPS responses.
            #
            # 308, not 301: 301 permits a client to rewrite POST/PUT/PATCH
            # into GET and drop the body, so an API call arriving on :80
            # reaches the backend as a bodyless GET and fails in a way that
            # looks like a routing bug. 308 is the method-preserving
            # equivalent, so the request completes over TLS instead.
            #
            # This does not un-leak anything: a body that reached :80 was
            # already sent in cleartext, and 301 would not have prevented
            # that - it only breaks the request afterwards. HSTS is the
            # actual mitigation; this just avoids a confusing failure mode.
            #
            # 308 is Extended support in Gateway API, not Core. Envoy Gateway
            # implements it (SupportedRedirectCodes covers 301/302/303/307/308),
            # but pre-2015 clients may not follow it - revert to 301 if any
            # such client matters.
            statusCode: 308
