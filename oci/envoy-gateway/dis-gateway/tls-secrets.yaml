# Same Key Vault and reader identity as tls-cert in default-gateway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dis-wildcard-tls-cert
  namespace: envoy-gateway-system
  annotations:
    # Deleting this deletes the Secret the dis listener serves TLS from.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-tls-cert-store
  target:
    name: dis-wildcard-tls-cert
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: '{{ .crt }}'
        tls.key: '{{ .key }}'
  data:
    - secretKey: crt
      remoteRef:
        key: star-${ENVIRONMENT}-dis-altinn-cloud-crt
    - secretKey: key
      remoteRef:
        key: star-${ENVIRONMENT}-dis-altinn-cloud-key
