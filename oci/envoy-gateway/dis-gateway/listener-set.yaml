apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: dis
  namespace: envoy-gateway-system
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
    namespace: envoy-gateway-system
  # Routes from any namespace may attach, but edge-route-guard only admits a
  # route for <host>.${ENVIRONMENT}.dis.altinn.cloud from namespaces annotated
  # with <host>.${ENVIRONMENT}.dis.altinn.cloud/edge-allowed-paths.
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.${ENVIRONMENT}.dis.altinn.cloud'
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dis-wildcard-tls-cert
    - name: http
      protocol: HTTP
      port: 80
      hostname: '*.${ENVIRONMENT}.dis.altinn.cloud'
      allowedRoutes:
        namespaces:
          from: All
