apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../default-gateway
patches:
  - target:
      kind: HelmRepository
      name: envoy-gateway
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-system
  - target:
      kind: HelmRelease
      name: envoy-gateway
    patch: |
      - op: replace
        path: /metadata/namespace
        value: platform-system
      - op: replace
        path: /spec/chart/spec/sourceRef/namespace
        value: platform-system
      - op: add
        path: /spec/targetNamespace
        value: envoy-gateway-system
      - op: add
        path: /spec/releaseName
        value: envoy-gateway
