# Workload identity for the Azure datasources. Every query from a public
# dashboard runs as this identity, so it must only have read access to the
# data those dashboards show. The federated identity credential subject is
# system:serviceaccount:grafana-public:grafana-public.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-public
  namespace: grafana-public
  annotations:
    azure.workload.identity/client-id: "${GRAFANA_PUBLIC_WI_CLIENT_ID}"
