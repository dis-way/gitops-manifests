# Input variables for the grafana-public Flux Kustomization, read through
# postBuild.substituteFrom. dis-system-store is a namespaced SecretStore in
# flux-system, and substituteFrom only reads Secrets from the Kustomization's
# own namespace, so both this ExternalSecret and its Secret live there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-public-vars
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-system-store
  target:
    name: grafana-public-vars
    creationPolicy: Owner
  # Key Vault secret names allow only alphanumerics and dashes, so each one is
  # mapped to its variable name explicitly.
  data:
    - secretKey: GRAFANA_PUBLIC_WI_CLIENT_ID
      remoteRef:
        key: grafana-public-wi-client-id
    - secretKey: GRAFANA_PUBLIC_ENTRA_CLIENT_ID
      remoteRef:
        key: grafana-public-entra-client-id
    - secretKey: GRAFANA_PUBLIC_ENTRA_CLIENT_SECRET
      remoteRef:
        key: grafana-public-entra-client-secret
    - secretKey: GRAFANA_PUBLIC_PROMETHEUS_URL
      remoteRef:
        key: grafana-public-prometheus-url
