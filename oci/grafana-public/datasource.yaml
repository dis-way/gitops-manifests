apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: azure-managed-prometheus
  namespace: grafana-public
spec:
  # Grafana runs on ephemeral storage and comes back empty after a restart; the
  # operator does not notice and only re-adds the datasource on resync (default
  # 10m). The public dashboards (altinn-dashboards-grafana public/) use 1m too.
  resyncPeriod: 1m
  instanceSelector:
    matchLabels:
      dashboards: "public-grafana"
  uid: azure-managed-prometheus
  datasource:
    name: Azure Managed Prometheus
    type: grafana-azureprometheus-datasource
    access: proxy
    url: "${GRAFANA_PUBLIC_PROMETHEUS_URL}"
    jsonData:
      httpMethod: POST
      azureCredentials:
        authType: workloadidentity
      timeoutSeconds: 30
