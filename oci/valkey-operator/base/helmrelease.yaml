apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-operator
  namespace: valkey-operator-system
spec:
  chart:
    spec:
      chart: valkey-operator
      sourceRef:
        kind: HelmRepository
        name: valkey-operator
        namespace: valkey-operator-system
      # renovate: datasource=docker depName=ghcr.io/valkey-io/valkey-helm/valkey-operator versioning=semver
      version: 0.5.0
  interval: 1h
  timeout: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    image:
      registry: altinncr.azurecr.io
      repository: ghcr.io/valkey-io/valkey-operator
    metrics:
      serviceMonitor:
        enabled: true
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.azure.com/mode: system
      kubernetes.azure.com/agentpool: syspool
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceMonitor
            patch: |
              - op: replace
                path: /apiVersion
                value: azmonitoring.coreos.com/v1
