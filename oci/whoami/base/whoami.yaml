apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
spec:
  # replicas is owned by the HPA (hpa.yaml); setting it here would make Flux reset it
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        app: whoami
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - image: altinncr.azurecr.io/docker.io/traefik/whoami
          imagePullPolicy: IfNotPresent
          name: whoami
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
          securityContext:
            readOnlyRootFilesystem: true
          # CPU request is required for the HPA's utilization target
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: whoami
spec:
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv6
    - IPv4
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
  selector:
    app: whoami
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: l5d-header-middleware
  namespace: whoami
spec:
  headers:
    customRequestHeaders:
      l5d-dst-override: whoami.whoami.svc.cluster.local:80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  entryPoints:
    - http
    - https
  routes:
    - kind: Rule
      match: HostRegexp(`^.*\.?altinn\.(no|cloud)$`) && (PathPrefix(`/whoami/`) || Path(`/whoami`))
      middlewares:
        - name: l5d-header-middleware
          namespace: whoami
      services:
        - name: whoami
          namespace: whoami
          port: 80
