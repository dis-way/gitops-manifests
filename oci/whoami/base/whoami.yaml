apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
spec:
  # replicas is owned by the HPA (hpa.yaml); setting it here would make Flux reset it
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        # The proxy idles at ~1m CPU / ~3Mi; limits stay at the cluster's Linkerd defaults
        config.linkerd.io/proxy-cpu-request: "5m"
        config.linkerd.io/proxy-memory-request: "16Mi"
      labels:
        app: whoami
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      # Spread replicas across nodes so a single node drain never takes all of them
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: whoami
      containers:
        - name: whoami
          # renovate: datasource=docker depName=traefik/whoami
          image: altinncr.azurecr.io/docker.io/traefik/whoami:v1.12.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"
          securityContext:
            readOnlyRootFilesystem: true
          # CPU request is required for the HPA's utilization target. Requests are kept
          # small; the memory limit leaves room for performance testing.
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: whoami
spec:
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv6
    - IPv4
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
  selector:
    app: whoami
