---
# Declares port 80 as HTTP/1 so the inbound Linkerd proxy skips protocol
# detection. A Server makes the port deny-by-default, so meshed clients
# (Traefik) are authorized below. With no HTTPRoutes attached here, Linkerd
# keeps authorizing kubelet probes on its own; the policies layer adds routes
# and explicit kubelet authorization for clusters with a restrictive default
# inbound policy.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: whoami-http
  namespace: whoami
spec:
  podSelector:
    matchLabels:
      app: whoami
  port: 80
  proxyProtocol: HTTP/1
---
# Mesh authentication for any meshed pod
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: any-meshed-pod
  namespace: whoami
spec:
  identities:
    - "*"
---
# Allow meshed traffic to the whoami HTTP port
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: whoami-http
  namespace: whoami
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: whoami-http
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: any-meshed-pod
