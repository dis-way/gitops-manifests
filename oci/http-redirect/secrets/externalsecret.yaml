# Input variables for the base layer's Flux Kustomization, read through
# postBuild.substituteFrom. dis-system-store is a namespaced SecretStore in
# flux-system, and substituteFrom only reads Secrets from the Kustomization's
# own namespace, so both this ExternalSecret and its Secret live there.
#
# The package is deployed once per redirect, so the Key Vault secret names
# and the Secret are prefixed with the Flux configuration name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${FLUX_CONFIGURATION_NAME}-substitute
  namespace: flux-system
  annotations:
    # The base Kustomization depends on the Secret, which External Secrets
    # deletes together with this ExternalSecret
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-system-store
  target:
    name: ${FLUX_CONFIGURATION_NAME}-substitute
    creationPolicy: Owner
  # Key Vault secret names allow only alphanumerics and dashes, so each one is
  # mapped to its variable name explicitly.
  data:
    - secretKey: REDIRECT_NAME
      remoteRef:
        key: ${FLUX_CONFIGURATION_NAME}-redirect-name
    - secretKey: REDIRECT_FROM_FQDN
      remoteRef:
        key: ${FLUX_CONFIGURATION_NAME}-redirect-from-fqdn
    - secretKey: REDIRECT_FROM_PATH_PREFIX
      remoteRef:
        key: ${FLUX_CONFIGURATION_NAME}-redirect-from-path-prefix
    - secretKey: REDIRECT_TO_FQDN
      remoteRef:
        key: ${FLUX_CONFIGURATION_NAME}-redirect-to-fqdn
    - secretKey: REDIRECT_TLS_SECRET_NAME
      remoteRef:
        key: ${FLUX_CONFIGURATION_NAME}-redirect-tls-secret-name
