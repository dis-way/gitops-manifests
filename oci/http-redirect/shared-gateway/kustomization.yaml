apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # Attach to a Gateway that already terminates TLS for the source host
  # instead of creating a dedicated one. No post-deploy Certificate needed.
  - patch: |
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: ${REDIRECT_NAME}
        namespace: ${REDIRECT_NAMESPACE:=traefik}
  - target:
      kind: HTTPRoute
    patch: |
      - op: replace
        path: /spec/parentRefs
        value:
          - name: ${REDIRECT_PARENT_GATEWAY_NAME}
            namespace: ${REDIRECT_PARENT_GATEWAY_NAMESPACE:=traefik}
            sectionName: ${REDIRECT_PARENT_GATEWAY_SECTION:=https}
