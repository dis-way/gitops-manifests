apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-dispatch-config
  namespace: flux-system
spec:
  force: false
  interval: 5m0s
  path: ./
  prune: true
  retryInterval: 5m0s
  images:
    - name: controller
      newName: altinncr.azurecr.io/ghcr.io/altinn/altinn-platform/flux-dispatch
      # renovate: datasource=docker depName=ghcr.io/altinn/altinn-platform/flux-dispatch versioning=semver
      newTag: v0.1.0
  sourceRef:
    kind: OCIRepository
    name: flux-dispatch-config
    namespace: flux-system
  targetNamespace: dis-platform
  timeout: 5m0s
  wait: true
