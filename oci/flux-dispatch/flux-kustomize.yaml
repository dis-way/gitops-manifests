apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-dispatch-config
  namespace: flux-system
spec:
  force: false
  interval: 5m0s
  path: ./
  postBuild:
    substitute:
      FLUX_DISPATCH_WORKLOAD_IDENTITY_CLIENT_ID: ${FLUX_DISPATCH_WORKLOAD_IDENTITY_CLIENT_ID}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID}
      KV_URI: ${KV_URI}
      KV_SECRET_NAME_GITHUB_APP_KEY: ${KV_SECRET_NAME_GITHUB_APP_KEY}
  prune: true
  retryInterval: 5m0s
  images:
    - name: controller
      newName: altinncr.azurecr.io/ghcr.io/altinn/altinn-platform/flux-dispatch
      # renovate: datasource=docker depName=ghcr.io/altinn/altinn-platform/flux-dispatch versioning=semver
      newTag: v1.0.0
  sourceRef:
    kind: OCIRepository
    name: flux-dispatch-config
    namespace: flux-system
  targetNamespace: dis-platform
  timeout: 5m0s
  wait: true
