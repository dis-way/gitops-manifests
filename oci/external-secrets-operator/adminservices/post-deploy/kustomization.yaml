apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ServiceAccount + SecretStore for the dis-system Key Vault. Admin clusters run all
  # Flux Kustomizations in flux-system, and postBuild.substituteFrom can only read
  # Secrets from the Kustomization's own namespace, so the store lives there too.
  - dis-system-kv-eso-sa.yaml
  - dis-system-kv-secretstore.yaml
