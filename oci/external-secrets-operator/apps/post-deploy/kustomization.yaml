apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # One ServiceAccount + ClusterSecretStore pair per Key Vault. The operator itself
  # runs without an Azure identity; auth is delegated to these ServiceAccounts via
  # the stores' serviceAccountRef.
  - altinn-kv-eso-sa.yaml
  - altinn-kv-clustersecretstore.yaml
  - so-kv-eso-sa.yaml
  - so-kv-clustersecretstore.yaml
  # dis-system-store: the standard SecretStore name every package's secrets layer
  # references. Namespaced in flux-system, because postBuild.substituteFrom only reads
  # Secrets from the Kustomization's own namespace. Backed by the Altinn Key Vault.
  - dis-system-kv-eso-sa.yaml
  - dis-system-kv-secretstore.yaml
