# This ExternalSecret supplies the input variables for the multitenancy/central-accesstoken
# Flux Kustomization. The Kustomization reads them through postBuild.substituteFrom.
# On DIS core clusters dis-system-store is a namespaced SecretStore in platform-system,
# where the Flux Kustomizations also run. substituteFrom only reads Secrets from the
# Kustomization's own namespace. This ExternalSecret and its Secret therefore live in
# platform-system.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secrets-operator-vars
  namespace: platform-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-system-store
  target:
    name: external-secrets-operator-vars
    creationPolicy: Owner
  # Key Vault secret names allow only alphanumerics and dashes. Each name maps
  # to its variable name explicitly.
  data:
    - secretKey: CENTRAL_ACCESSTOKEN_KV_URL
      remoteRef:
        key: external-secrets-operator-central-accesstoken-kv-url
