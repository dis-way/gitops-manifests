# Lets the push identity read and update the destination Secret, and nothing else. The
# store validates with get; the PushSecret replaces the token with update.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-dispatch-${FLUX_DISPATCH_NAME}
  namespace: ${TOKEN_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["${TOKEN_SECRET_NAME}"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-dispatch-${FLUX_DISPATCH_NAME}
  namespace: ${TOKEN_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-dispatch-${FLUX_DISPATCH_NAME}
subjects:
  - kind: ServiceAccount
    name: flux-dispatch-${FLUX_DISPATCH_NAME}
    namespace: platform-system
