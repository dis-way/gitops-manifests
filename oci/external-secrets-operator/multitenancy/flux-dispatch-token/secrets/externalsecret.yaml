# Input variables for one flux-dispatch-token mapping, read through
# postBuild.substituteFrom. On DIS core clusters dis-system-store and the Flux
# Kustomizations are in platform-system, and substituteFrom only reads Secrets from the
# Kustomization's own namespace, so this ExternalSecret and its Secret live there.
#
# The layer is deployed once per mapping, so the Key Vault secret names and the Secret
# are prefixed with the mapping name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-dispatch-${FLUX_DISPATCH_NAME}-vars
  namespace: platform-system
  annotations:
    # The flux-dispatch-token Kustomization depends on the Secret, which External
    # Secrets deletes together with this ExternalSecret
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-system-store
  target:
    name: flux-dispatch-${FLUX_DISPATCH_NAME}-vars
    creationPolicy: Owner
  # Key Vault secret names allow only alphanumerics and dashes, so each one is mapped to
  # its variable name explicitly.
  data:
    - secretKey: GITHUB_REPOSITORY_NAME
      remoteRef:
        key: flux-dispatch-${FLUX_DISPATCH_NAME}-github-repository-name
    - secretKey: TOKEN_NAMESPACE
      remoteRef:
        key: flux-dispatch-${FLUX_DISPATCH_NAME}-token-namespace
    - secretKey: TOKEN_SECRET_NAME
      remoteRef:
        key: flux-dispatch-${FLUX_DISPATCH_NAME}-token-secret-name
