# Copies the token to the product's Secret every minute. Only the token key is copied.
# The source Secret only ever holds a generated token, so a failure never pushes an
# empty value.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: flux-dispatch-${FLUX_DISPATCH_NAME}
  namespace: platform-system
spec:
  refreshInterval: 1m
  updatePolicy: Replace
  # Flux owns the destination Secret (destination-secret.yaml), so removing the mapping
  # removes it. Delete would add a finalizer that needs the store and its RBAC to still
  # exist while the PushSecret is deleted.
  deletionPolicy: None
  secretStoreRefs:
    - name: flux-dispatch-${FLUX_DISPATCH_NAME}
      kind: SecretStore
  selector:
    secret:
      name: flux-dispatch-${FLUX_DISPATCH_NAME}-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: ${TOKEN_SECRET_NAME}
          property: token
