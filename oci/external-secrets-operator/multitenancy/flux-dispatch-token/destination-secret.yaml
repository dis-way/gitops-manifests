# The Secret the product's Flux Provider reads. Flux creates it once, empty, and never
# updates it; the PushSecret writes the token. Because it already exists, the push
# identity needs no create right, which Kubernetes cannot limit to one Secret name.
apiVersion: v1
kind: Secret
metadata:
  name: ${TOKEN_SECRET_NAME}
  namespace: ${TOKEN_NAMESPACE}
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
