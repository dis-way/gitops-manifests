# Writes to one product namespace only. The store is in platform-system, so products
# cannot change the namespace or the identity it writes with.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: flux-dispatch-${FLUX_DISPATCH_NAME}
  namespace: platform-system
spec:
  provider:
    kubernetes:
      remoteNamespace: ${TOKEN_NAMESPACE}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: flux-dispatch-${FLUX_DISPATCH_NAME}
