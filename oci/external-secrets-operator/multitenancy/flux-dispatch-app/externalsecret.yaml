# The App ID, installation ID and private key of the shared Flux dispatch GitHub App.
# The private key stays in platform-system: only the tokens generated from it leave the
# namespace, through multitenancy/flux-dispatch-token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-dispatch-github-app
  namespace: platform-system
  annotations:
    # Every flux-dispatch-token generator reads the Secret, which External Secrets
    # deletes together with this ExternalSecret
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dis-system-store
  target:
    name: flux-dispatch-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: flux-dispatch-github-app-id
    - secretKey: installation-id
      remoteRef:
        key: flux-dispatch-github-app-installation-id
    - secretKey: private-key
      remoteRef:
        key: flux-dispatch-github-app-private-key
