apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: central-accesstoken-store
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Only product namespaces can use the store.
  conditions:
    - namespaceRegexes:
        - "^product-"
  provider:
    azurekv:
      authType: WorkloadIdentity
      environmentType: PublicCloud
      serviceAccountRef:
        name: central-accesstoken-eso
        namespace: platform-system
      vaultUrl: "${CENTRAL_ACCESSTOKEN_KV_URL}"
