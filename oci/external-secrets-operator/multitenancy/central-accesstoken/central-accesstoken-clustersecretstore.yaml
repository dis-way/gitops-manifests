apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: central-accesstoken-store
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Only namespaces granted access by the platform team can use the store.
  conditions:
    - namespaceSelector:
        matchLabels:
          accesstoken.dis.altinn.cloud/enabled: "true"
  provider:
    azurekv:
      authType: WorkloadIdentity
      environmentType: PublicCloud
      serviceAccountRef:
        name: central-accesstoken-eso
        namespace: platform-system
      vaultUrl: "${CENTRAL_ACCESSTOKEN_KV_URL}"
