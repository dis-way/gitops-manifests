apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # central-accesstoken-store: gives product namespaces labeled
  # accesstoken.dis.altinn.cloud/enabled=true the central access token. The store
  # authenticates as the ServiceAccount that dis-identity-operator creates for the
  # ApplicationIdentity. Its own layer, not post-deploy: it reads its variables
  # through dis-system-store, which multitenancy/post-deploy creates.
  - central-accesstoken-identity.yaml
  - central-accesstoken-clustersecretstore.yaml
