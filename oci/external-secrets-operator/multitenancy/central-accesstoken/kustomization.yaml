apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # central-accesstoken-store: gives namespaces prefixed product- the central
  # access token. The store authenticates as the ServiceAccount that
  # dis-identity-operator creates for the ApplicationIdentity. Its own layer, not post-deploy: it reads its variables
  # through dis-system-store, which multitenancy/post-deploy creates.
  - central-accesstoken-identity.yaml
  - central-accesstoken-clustersecretstore.yaml
