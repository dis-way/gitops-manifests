apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-webhook
spec:
  hostnames:
    - ${BASE_HOSTNAME}
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    # Only POST /flux-webhook/hook/<digest>. Other requests to the platform host
    # name keep their existing route.
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /flux-webhook/hook
      filters:
        # The core listener serves flux-webhook.<core host>, and the
        # notification-controller finds the Receiver by the path /hook/<digest>.
        - type: URLRewrite
          urlRewrite:
            hostname: flux-webhook.${DIS_CORE_GATEWAY_HOSTNAME}
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /hook
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: flux-webhook-core
