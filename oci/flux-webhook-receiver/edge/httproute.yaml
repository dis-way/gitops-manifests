apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-webhook
spec:
  hostnames:
    - ops.${ENVIRONMENT}.dis.altinn.cloud
  parentRefs:
    # The HTTPS listener of the dis ListenerSet, which serves
    # *.<environment>.dis.altinn.cloud with a wildcard certificate.
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: dis
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    # Only POST /flux-webhook/hook/<digest>.
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /flux-webhook/hook
      filters:
        # The core listener serves flux-webhook.<core host>, and the
        # notification-controller finds the Receiver by the path /hook/<digest>.
        - type: URLRewrite
          urlRewrite:
            hostname: flux-webhook.${DIS_CORE_GATEWAY_HOSTNAME}
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /hook
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: flux-webhook-core
