apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook-receiver
  namespace: flux-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      # Only the dedicated listener from the traefik layer
      # multitenancy-flux-webhook. Its Service admits only the DIS edge
      # outbound ranges on port 9443.
      sectionName: flux-webhook
  hostnames:
    - flux-webhook.${DEFAULT_GATEWAY_HOSTNAME}
  rules:
    # The notification-controller finds the Receiver by the exact request
    # path, so the route must not rewrite it.
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /hook
      backendRefs:
        - name: webhook-receiver
          port: 80
