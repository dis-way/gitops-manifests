# Only the Traefik pods can reach the webhook port of the notification-controller.
# Without this policy, a workload in the cluster can call a Receiver without the
# edge gateway and its rate limits, and each call makes Flux send two requests
# to GitHub. Labels and ports are from the upstream Flux manifests.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-webhook-from-traefik
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: notification-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 9292 # Webhook receiver
          protocol: TCP
    # A policy that selects a pod blocks every port it does not admit, so keep
    # the other ports open as before.
    - ports:
        - port: 9090 # Events from the Flux controllers
          protocol: TCP
        - port: 8080 # Metrics
          protocol: TCP
        - port: 9440 # Health probes
          protocol: TCP
