apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook-receiver
  namespace: flux-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      # HTTPS only: callers authenticate with a bearer token.
      sectionName: https-wildcard
  hostnames:
    - flux-webhook.${DEFAULT_GATEWAY_HOSTNAME}
  rules:
    # The notification-controller looks a Receiver up by the exact request
    # path, so the route must not rewrite it.
    - matches:
        - path:
            type: PathPrefix
            value: /hook
      backendRefs:
        - name: webhook-receiver
          port: 80
